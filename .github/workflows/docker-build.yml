name: Build and Publish Container Image

on:
  push:
    branches:
      - master
    paths:
      - ".env.example"
      - ".github/workflows/docker-build.yml"
      - "config.default"
      - "Dockerfile"
      - "docker-compose.yml"
      - "entrypoint.sh"
      - "healthcheck.sh"
      - "tests/**"
  pull_request:
    paths:
      - ".env.example"
      - ".github/workflows/docker-build.yml"
      - "config.default"
      - "Dockerfile"
      - "docker-compose.yml"
      - "entrypoint.sh"
      - "healthcheck.sh"
      - "tests/**"
  workflow_dispatch:
    inputs:
      zapret_tag:
        description: "zapret2 release tag; empty uses .env.example"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell syntax
        run: sh -n entrypoint.sh healthcheck.sh

      - name: Validate Compose configuration
        env:
          SS_PASSWORD: test-only-not-for-runtime
        run: docker compose config >/dev/null

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image and zapret2 tags
        id: tags
        shell: bash
        env:
          INPUT_ZAPRET_TAG: ${{ inputs.zapret_tag }}
        run: |
          default_tag="$(sed -n 's/^ZAPRET_TAG=//p' .env.example)"
          zapret_tag="${INPUT_ZAPRET_TAG:-${default_tag}}"
          if [[ ! "${zapret_tag}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid zapret2 tag: ${zapret_tag}" >&2
            exit 1
          fi
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          echo "zapret_tag=${zapret_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ZAPRET_TAG=${{ steps.tags.outputs.zapret_tag }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.image_name }}:latest
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.image_name }}:${{ steps.tags.outputs.zapret_tag }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.image_name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
