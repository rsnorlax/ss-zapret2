services:
  ss-zapret2:
    image: ${SS_ZAPRET2_IMAGE:-ss-zapret2:local}
    network_mode: bridge
    build:
      context: .
      args:
        ZAPRET_TAG: ${ZAPRET_TAG:-v1.0.6}
    restart: unless-stopped
    environment:
      SS_PORT: ${SS_PORT:-8388}
      SS_PASSWORD: ${SS_PASSWORD:?copy .env.example to .env and set SS_PASSWORD}
      SS_ENCRYPT_METHOD: ${SS_ENCRYPT_METHOD:-chacha20-ietf-poly1305}
      SS_TIMEOUT: ${SS_TIMEOUT:-300}
      SOCKS_PORT: ${SOCKS_PORT:-1081}
      SS_VERBOSE: ${SS_VERBOSE:-0}
      DNS_SERVER: ${DNS_SERVER:-quad9_tls}
    ports:
      - "127.0.0.1:${SOCKS_PORT:-1081}:${SOCKS_PORT:-1081}/tcp"
      - "127.0.0.1:${SOCKS_PORT:-1081}:${SOCKS_PORT:-1081}/udp"
    volumes:
      - ./config:/opt/zapret2/config
      - ./lua:/opt/zapret2/lua
      - ./fakes:/opt/zapret2/files/fake
      - ./scripts/examples:/opt/zapret2/init.d/custom.d.examples.linux
      - ./scripts/custom.d:/opt/zapret2/init.d/sysv/custom.d
    healthcheck:
      test: ["CMD", "/opt/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "3"
